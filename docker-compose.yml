services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: visits
    networks:
      - app-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:  # healthcheck с pg_isready каждые 5 секунд проверяет, готова ли база принимать подключения.
      test: ["CMD-SHELL", "pg_isready -U app -d visits"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: ./lab-1
    env_file:
      - ./lab-1/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432 # ports есть только у app; БД наружу не открыта
      DB_USER: app
      DB_PASSWORD: changeme
      DB_NAME: visits
    ports:
      - "5000:5000"
    networks:
      - app-network
    depends_on: # app стартует только после того, как db получит статус healthy
      db:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:  # данные базы лежат в томе, а не в контейнере
  pgdata: